<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toy Yoda | Customs Checkpoint</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Audiowide&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="intro-overlay"></div>

    <div class="camera-rig" id="cameraRig">
        <div class="parallax-layer" data-speed="1">
            <div class="parallax-img intro-bg" style="background-image: url('images/bg-space.png');"></div>
        </div>
        
        <div class="parallax-layer" data-speed="3">
            <div class="parallax-img intro-planet" style="background-image: url('images/planet-main.png');"></div>
        </div>
        
        <div class="parallax-layer" data-speed="5">
            <div class="parallax-img intro-rim" style="background-image: url('images/planet-rim.png');"></div>
        </div>
        
        <div class="parallax-layer" data-speed="8">
            <div class="parallax-img intro-ship" style="background-image: url('images/ship-right.png');"></div>
        </div>
        <div class="parallax-layer" data-speed="9">
            <div class="parallax-img intro-ship" style="background-image: url('images/ship-left.png');"></div>
        </div>
    </div>

    <main class="terminal-container">
        
        <div class="ui-wrapper ui-reveal">
            <div class="brand-header">
                <h1 class="main-title">TOY YODA</h1>
            </div>

            <div id="startPrompt" class="start-prompt">
                <p class="blink-text">PRESS [ ENTER ] TO START</p>
            </div>
        </div>

        <div class="auth-box hidden" id="authBox">
            <form id="loginForm" class="auth-form active-form">
                <h2>// LOGIN REQUIRED</h2>
                <div class="input-group">
                    <label>> EMAIL</label>
                    <input type="email" id="loginEmail" required placeholder="name@sector.com">
                </div>
                <div class="input-group">
                    <label>> PASSWORD</label>
                    <div class="password-wrapper">
                        <input type="password" id="loginPass" required placeholder="••••••••">
                        <button type="button" class="eye-btn" id="toggleLoginPass">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <p class="error-msg hidden" id="loginError">> ERROR: INVALID CREDENTIALS</p>
                
                <button type="submit" class="tac-btn tac-btn--lg">[ SUBMIT CREDENTIALS ]</button>
                <p class="toggle-link" id="showRegister">> NO ACCOUNT? [ CREATE HERE ]</p>
            </form>

            <form id="registerForm" class="auth-form hidden-form">
                <div class="tactical-line"></div>
                <h2>// NEW ACCOUNT ENTRY</h2>
                <div class="input-group">
                    <label>> USERNAME</label>
                    <input type="text" id="regName" required placeholder="CT-5555">
                </div>
                <div class="input-group">
                    <label>> EMAIL</label>
                    <input type="email" required placeholder="name@sector.com">
                </div>
                <div class="input-group">
                    <label>> PASSWORD</label>
                    <div class="password-wrapper">
                        <input type="password" id="regPassword" required placeholder="••••••••">
                        <button type="button" class="eye-btn" id="toggleRegPass">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <p class="error-msg hidden" id="registerError">> ERROR: ACCOUNT ALREADY EXISTS</p>
                
                <button type="submit" class="tac-btn tac-btn--lg">[ REGISTER ]</button>
                <p class="toggle-link" id="showLogin">> BACK TO LOGIN</p>
            </form>
        </div>
    </main>

    <script src="/js/auth.js"></script>
</body>
</html>
