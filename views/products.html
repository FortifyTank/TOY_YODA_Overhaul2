<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toy Yoda | Catalog</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Audiowide&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="crt-theme">
    
    <div class="top-command-bar">
        <header class="global-header">
            <div class="header-left">
                <a href="/login" class="clearance">[ LOG IN ]</a>
            </div>
            <div class="header-logo">
                <img src="/images/Toy_Yoda_Title.png" alt="Toy Yoda" class="nav-brand-img">
            </div>
            <div class="header-right">
                <div class="header-search">
                    <input type="text" id="searchInput" placeholder="SEARCH CATALOG...">
                </div>
                <span class="cart-status">[ CART: 0 ]</span> 
            </div>
        </header>
        <nav class="global-nav">
            <div class="nav-status-light"></div> 
            <a href="/home" class="nav-link">> OVERVIEW</a>
            <a href="#" class="nav-link active">> CATALOG</a>
            <a href="#" class="nav-link">> CONTACT_US</a>
            <a href="#" class="nav-link">> FORUM</a>
        </nav>
    </div>

    <main class="catalog-layout">
        
        <aside class="catalog-sidebar cyber-panel">
            <h3 class="sidebar-title">> SYSTEM_FILTERS</h3>
            
            <div class="filter-group">
                <div class="range-slider-container">
                    <span class="range-value" id="priceDisplay">MAX PRICE: ANY</span>
                    <input type="range" min="0" max="15500" step="500" value="15500" class="tactical-slider" id="priceSlider">
                    <div class="slider-labels">
                        <span>₱0</span>
                        <span>ANY</span>
                    </div>
                </div>
            </div>

            <div class="filter-group">
                <h4>// THEME</h4>
                <label class="tactical-checkbox">
                    <input type="checkbox" class="theme-checkbox" value="STAR WARS">
                    <span class="check-box"></span> STAR WARS
                </label>
                <label class="tactical-checkbox">
                    <input type="checkbox" class="theme-checkbox" value="TRANSFORMERS">
                    <span class="check-box"></span> TRANSFORMERS
                </label>
                <label class="tactical-checkbox">
                    <input type="checkbox" class="theme-checkbox" value="METAL GEAR">
                    <span class="check-box"></span> METAL GEAR
                </label>
                <label class="tactical-checkbox">
                    <input type="checkbox" class="theme-checkbox" value="POKÉMON">
                    <span class="check-box"></span> POKÉMON
                </label>
            </div>

            <div class="filter-group">
                <h4>// AVAILABILITY</h4>
                <label class="tactical-checkbox">
                    <input type="checkbox" class="stock-checkbox" value="IN STOCK">
                    <span class="check-box"></span> IN STOCK
                </label>
                <label class="tactical-checkbox">
                    <input type="checkbox" class="stock-checkbox" value="OUT OF STOCK">
                    <span class="check-box"></span> OUT OF STOCK
                </label>
            </div>
        </aside>

        <section class="catalog-content">
            
            <div class="sort-bar">
                <span class="sort-label">> SORT BY:</span>
                
                <select id="sortDropdown" class="tactical-dropdown">
                    <option value="LATEST" selected>LATEST</option>
                    <option value="RELEVANCE">RELEVANCE</option>
                    <option value="OLDEST">OLDEST</option>
                    <option value="PRICE: LOW TO HIGH">PRICE: LOW TO HIGH</option>
                    <option value="PRICE: HIGH TO LOW">PRICE: HIGH TO LOW</option>
                    <option value="NAME: A-Z">NAME: A-Z</option>
                    <option value="NAME: Z-A">NAME: Z-A</option>
                    <option value="DEEP DISCOUNTS">DEEP DISCOUNTS</option>
                </select>

                <div id="topPagination" class="pagination-controls" style="margin: 0 auto;"></div>
                
                <div id="resultCount">
                    [ SHOWING: 0/0 ]
                </div>
            </div>

            <div class="product-grid" id="product-container">
            </div>

            <div id="bottomPagination" class="pagination-controls bottom-nav"></div>
        </section>
    </main>

    <div id="cartOverlay" class="cart-overlay"></div>
    
    <div id="cartDrawer" class="cart-drawer cyber-panel">
        <div class="cart-header">
            <h3>// YOUR CART</h3>
            <button id="closeCartBtn" class="close-btn">[ X ]</button>
        </div>
        
        <div id="cartItemsContainer" class="cart-items"></div>
        
        <div class="cart-footer">
            <div class="cart-total-row">
                <span>TOTAL ESTIMATE:</span>
                <span id="cartTotalDisplay" class="text-amber">₱0</span>
            </div>
            <button class="tac-btn tac-btn--full tac-btn--lg">[ PROCEED TO CHECKOUT ]</button>
            <button id="clearCartBtn" class="tac-btn tac-btn--full tac-btn--ghost" style="margin-top: 10px;">[ CLEAR CART ]</button>
        </div>
    </div>

    <div id="systemAlert" class="system-alert-box">
        <div class="alert-icon">[!]</div>
        <div class="alert-message" id="systemAlertMessage">> SYSTEM WARNING</div>
        <button class="tac-btn" id="systemAlertOkBtn">[ ACKNOWLEDGE ]</button>
    </div>

    <div id="bootOverlay" class="boot-overlay"></div>
    <script src="/js/dashboard.js"></script>
    <script src="/js/catalog.js"></script>
    <script src="/js/cart.js"></script>
</body>
</html>
